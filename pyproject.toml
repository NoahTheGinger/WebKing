[project]
name = "webking"
version = "0.1.0"
description = "MCP server for deep web application introspection and reverse-engineering workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "WebKing Builders" }
]
dependencies = [
  "fastmcp>=0.4.1",
  "pydantic>=2.8.2",
  "playwright>=1.48.0",
  "beautifulsoup4>=4.12.3",
  "httpx>=0.27.2",
  "jsbeautifier>=1.14.11",
  "py-mini-racer>=0.6.0",
  "typer>=0.12.5",
  "rich>=13.9.1",
  "python-slugify>=8.0.4",
  "tenacity>=9.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0"
]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
